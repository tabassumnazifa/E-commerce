plugins {
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' // <--- Version removed, managed by root
    id 'java'
    id 'application'
}

dependencies {
    implementation project(':module-order-rs')
    implementation project(':module-auth-as')
    implementation project(':module-product')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
    runtimeOnly 'org.postgresql:postgresql'
}

application {
    mainClass = 'com.ecommerce.gateway.GatewayApplication'
}